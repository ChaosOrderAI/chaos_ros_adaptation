# The update executor only validates the request and reports a simulated result.
schema_version: 1
model: demo_ota
model_version: v1
kind: ugv
capabilities: [state, motion.velocity, motion.stop, navigation.pose, system.ota]
limits:
  linear_mps: 1.0
  angular_rps: 1.0
  command_timeout_s: 0.5
