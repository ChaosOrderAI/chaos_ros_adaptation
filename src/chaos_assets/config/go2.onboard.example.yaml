# Copy to /etc/chaos/asset.yaml on ONE Go2. Set its actual identity,
# network interface, frames, ROS domain, broker and certificates before starting.
# ROS Domain 55 follows the legacy deployment and must be checked on the device.
# The Unitree SDK DDS domain (driver.options.dds_domain_id) is independent.
schema_version: 1
hosts:
  onboard: {ros_domain_id: 55}
transports:
  platform:
    config:
      network: {access: system}
      mqtt:
        host: mqtt.example.com
        port: 8883
        client_id: chaos-{asset_id}
        ca_file: /etc/chaos/certs/ca.crt
        client_certificate_file: /etc/chaos/certs/client.crt
        client_key_file: /etc/chaos/certs/client.key
        password_environment: MQTT_PASSWORD
assets:
  - id: dog_001
    model_file: package://chaos_assets/models/unitree_go2/v1/model.yaml
    host: onboard
    mode: real
    frames: {base: dog_001/base_link, odom: dog_001/odom, map: dog_001/map}
    driver:
      options:
        network_interface: eno1
        dds_domain_id: 0
        sport_state_topic: rt/sportmodestate
        cmd_vel_topic: /go2/cmd_vel
        odom_topic: /go2/odom
        velocity_frame: odom
    transport: platform
