# Uses chaos_mqtt's integrated transport and provisioned certificates.
# This template is not used by the default launch.
schema_version: 1
hosts:
  dev: {ros_domain_id: 87}
transports:
  edge_mqtt:
    # executable is optional: the default resolves from the ROS package index.
    config:
      mqtt:
        host: mqtt.example.com
        port: 8883
        client_id: chaos-{asset_id}
        ca_file: /etc/chaos/certs/ca.crt
        client_certificate_file: /etc/chaos/certs/client.crt
        client_key_file: /etc/chaos/certs/client.key
        password_environment: MQTT_PASSWORD
assets:
  - id: vehicle_001
    model_file: ../models/lingao_vehicle/v1/model.yaml
    host: dev
    mode: mock
    transport: edge_mqtt
  - id: drone_001
    model_file: ../models/dji_m3td/v1/model.yaml
    host: dev
    mode: mock
    transport: edge_mqtt
