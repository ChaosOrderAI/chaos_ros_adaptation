# Front camera that feeds VIO. PLACEHOLDER intrinsics: calibrate the real
# camera and replace every value. Distortion is OpenCV radtan (k1 k2 p1 p2 k3).
#
# Size is NOT free: the Hikrobot MV-CS050-10GC asset driver outputs
# 1224x1024 (2x2 binning, full FOV) and VIOManager::processFrame only
# resizes when the incoming size differs from cam_width x cam_height —
# and then assumes `scale` was already baked into these intrinsics. Keep
# scale 1.0 and this exact size, or the patch sampling stride breaks.
/**:
  ros__parameters:
    cam_model: "Pinhole"
    cam_width: 1224
    cam_height: 1024
    scale: 1.0
    cam_fx: 1500.0
    cam_fy: 1500.0
    cam_cx: 612.0
    cam_cy: 512.0
    cam_d0: 0.0
    cam_d1: 0.0
    cam_d2: 0.0
    cam_d3: 0.0
    cam_d4: 0.0
