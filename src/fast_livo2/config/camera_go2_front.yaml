# Front camera that feeds VIO. PLACEHOLDER intrinsics: calibrate the real
# camera and replace every value. Distortion is OpenCV radtan (k1 k2 p1 p2 k3).
/**:
  ros__parameters:
    cam_model: "Pinhole"
    cam_width: 1280
    cam_height: 1024
    scale: 0.5
    cam_fx: 1000.0
    cam_fy: 1000.0
    cam_cx: 640.0
    cam_cy: 512.0
    cam_d0: 0.0
    cam_d1: 0.0
    cam_d2: 0.0
    cam_d3: 0.0
    cam_d4: 0.0
