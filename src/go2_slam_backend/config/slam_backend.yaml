slam_backend:
  ros__parameters:
    odom_topic: /aft_mapped_to_init
    cloud_topic: /cloud_registered
    # FAST-LIVO2 publishes the registered cloud in camera_init, which this node treats as odom.
    cloud_in_odom: true
    # Publish odom -> base_link here. Do not also bridge the ROS 1 camera_init -> aft_mapped TF.
    publish_frontend_tf: true
    keyframe_distance: 0.6
    keyframe_yaw: 0.35
    min_loop_gap: 20
    ring_bins: 60
    ring_similarity: 0.86
    ring_ambiguity: 0.04
    icp_fitness: 0.20
    icp_max_correction: 5.0
    voxel_leaf: 0.4
    odom_rotation_weight: 20.0
    odom_translation_weight: 20.0
    loop_rotation_weight: 5.0
    loop_translation_weight: 5.0
    obstacle_min_z: 0.15
    obstacle_max_z: 1.6
    # IMU / base_link height above the local floor. Placeholder until measured.
    base_to_ground: 0.35
    # Trunk pose for scan_planner and the closed-loop controller. The offset is
    # looked up from TF (base_link -> trunk in go2_sensors.urdf), not configured
    # here, so the URDF remains the single source of truth.
    publish_body_pose: true
    body_pose_topic: /body_pose
    base_frame: base_link
    body_pose_frame: trunk
    grid_resolution: 0.1
    grid_half_size: 40.0
