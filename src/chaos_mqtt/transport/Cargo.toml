[package]
name = "mqtt_ros2_adapter"
version = "0.1.0"
edition = "2021"
description = "MQTT to ROS 2 message adapter layer (Rust port of the m3td_psdk orin_gateway bridge)"
license = "MIT"

[dependencies]
r2r = { git = "https://github.com/sequenceplanner/r2r", tag = "0.9.7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"

[dev-dependencies]
bytes = "1"
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
