# Offline training export. Fill episode directory/range and verify every driver
# timestamp/frame/unit before use. These are asset vehicle_001 example topics.
schema_version: 1
fps: 10
allow_unverified_time: false
features:
  observation.state:
    kind: vector
    topic: /robots/vehicle_001/state
    type: chaos_interfaces/msg/RobotState
    fields: [pose.pose.position.x, pose.pose.position.y, pose.pose.position.z,
             pose.pose.orientation.x, pose.pose.orientation.y, pose.pose.orientation.z,
             pose.pose.orientation.w]
    units: [m, m, m, dimensionless, dimensionless, dimensionless, dimensionless]
    stamp_field: pose.header.stamp
    frame_field: pose.header.frame_id
    frame: vehicle_001/odom
    clock_domain: system_utc
    validity_fields: [connected, pose_valid]
    max_age_ms: 100
  observation.images.front:
    kind: image
    units: intensity
    topic: /robots/vehicle_001/sensors/front_camera/color/image_raw
    type: sensor_msgs/msg/Image
    stamp_field: header.stamp
    frame_field: header.frame_id
    frame: vehicle_001_front_camera_color_optical_frame
    clock_domain: system_utc
    max_age_ms: 100
action:
  topic: /robots/vehicle_001/control_trace
  space: base_velocity_2d
  clock_domain: system_utc
  fields: [velocity.linear.x, velocity.angular.z]
  units: [m/s, rad/s]
  frame: vehicle_001/base_link
  max_age_ms: 200
episodes:
  - id: vehicle_task_0001
    session: /data/recordings/vehicle_001/REPLACE_WITH_SESSION
    segment: 1
    start_utc_ns: REPLACE_WITH_START_UTC_NS
    end_utc_ns: REPLACE_WITH_END_UTC_NS
    task: REPLACE_WITH_TASK_INSTRUCTION
    outcome: unknown
