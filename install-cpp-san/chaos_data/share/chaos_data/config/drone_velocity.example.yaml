# Schema example for a future drone backend with valid pose + body velocity.
# Current DJI legacy backend is read-only with pose_valid=false; it cannot supply
# this supervised action dataset. Do not turn missing telemetry into zeros.
schema_version: 1
fps: 10
allow_unverified_time: false
features:
  observation.state:
    kind: vector
    topic: /robots/drone_001/state
    type: chaos_interfaces/msg/RobotState
    fields: [pose.pose.position.x, pose.pose.position.y, pose.pose.position.z,
             pose.pose.orientation.x, pose.pose.orientation.y, pose.pose.orientation.z,
             pose.pose.orientation.w]
    units: [m, m, m, dimensionless, dimensionless, dimensionless, dimensionless]
    stamp_field: pose.header.stamp
    frame_field: pose.header.frame_id
    frame: drone_001/odom
    clock_domain: system_utc
    validity_fields: [connected, pose_valid]
    max_age_ms: 100
action:
  topic: /robots/drone_001/control_trace
  space: body_velocity_4d
  clock_domain: system_utc
  fields: [velocity.linear.x, velocity.linear.y, velocity.linear.z, velocity.angular.z]
  units: [m/s, m/s, m/s, rad/s]
  frame: drone_001/base_link
  max_age_ms: 200
episodes:
  - id: drone_task_0001
    session: /data/recordings/drone_001/REPLACE_WITH_SESSION
    segment: 1
    start_utc_ns: REPLACE_WITH_START_UTC_NS
    end_utc_ns: REPLACE_WITH_END_UTC_NS
    task: REPLACE_WITH_TASK_INSTRUCTION
    outcome: unknown
